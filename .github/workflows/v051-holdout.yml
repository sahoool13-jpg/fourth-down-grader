name: v0.5.1 holdout unlock

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type UNLOCK-2025 only after v0.5.1 development gate is PASS"
        required: true
        default: "LOCKED"

permissions:
  contents: write

concurrency:
  group: fourth-down-v051-holdout
  cancel-in-progress: false

jobs:
  holdout:
    if: ${{ github.event.inputs.confirmation == 'UNLOCK-2025' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_SEASON: "2025"
      END_SEASON: "2025"
      HOLDOUT_SEASON: "2025"
      V051_PHASE: "holdout"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            github::nflverse/nfl4th
            any::dplyr
            any::jsonlite
            any::stringr

      - name: Verify v0.5.1 development gate passed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'public/calibration/v051-development.json';
          if (!fs.existsSync(path)) {
            console.error('v0.5.1 development report is missing. Refusing to unlock 2025.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report?.productVersion !== 'v0.5.1') {
            console.error(`Unexpected candidate version: ${report?.productVersion}`);
            process.exit(1);
          }

          if (report?.phase !== 'development') {
            console.error(`Expected development report, got: ${report?.phase}`);
            process.exit(1);
          }

          if (report?.promotionGate?.status !== 'PASS') {
            console.error(`Development promotion gate is ${report?.promotionGate?.status || 'UNKNOWN'}, not PASS.`);
            process.exit(1);
          }

          const seasons = report?.referenceMetadata?.seasons || [];
          if (seasons.some(s => Number(s) >= 2025)) {
            console.error(`Development report contains holdout season: ${seasons.join(', ')}`);
            process.exit(1);
          }

          console.log('Development gate verified: PASS.');
          console.log(`Development seasons: ${seasons.join(', ')}`);
          console.log('2025 holdout may now be evaluated once.');
          NODE

      - name: Unit tests
        run: npm test

      - name: Export holdout reference (2025 only)
        run: Rscript scripts/export_nfl4th_reference.R

      - name: Verify strict holdout isolation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const ref = JSON.parse(fs.readFileSync('.calibration/reference.json', 'utf8'));
          const rows = ref?.rows || [];
          const seasons = [...new Set(rows.map(r => Number(r.season)))].sort();

          if (seasons.length !== 1 || seasons[0] !== 2025) {
            console.error(`HOLDOUT ISOLATION FAILURE: expected only 2025, got ${seasons.join(', ')}`);
            process.exit(1);
          }

          if (rows.length < 500) {
            console.error(`Holdout sample unexpectedly small: ${rows.length}`);
            process.exit(1);
          }

          console.log(`2025 holdout isolation verified: ${rows.length} reference states.`);
          NODE

      - name: Score frozen v0.5.1 on 2025 holdout
        run: node scripts/run_v051_experiment.mjs

      - name: Verify holdout result
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'public/calibration/v051-holdout.json';
          if (!fs.existsSync(path)) {
            console.error('v0.5.1 holdout report was not generated.');
            process.exit(1);
          }

          const r = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (r?.productVersion !== 'v0.5.1') {
            console.error(`Wrong candidate version: ${r?.productVersion}`);
            process.exit(1);
          }

          if (r?.phase !== 'holdout') {
            console.error(`Wrong phase: ${r?.phase}`);
            process.exit(1);
          }

          const seasons = r?.referenceMetadata?.seasons || [];
          if (seasons.length !== 1 || Number(seasons[0]) !== 2025) {
            console.error(`Holdout report is not 2025-only: ${seasons.join(', ')}`);
            process.exit(1);
          }

          if (!r?.rowsScored || r.rowsScored < 500) {
            console.error(`Holdout sample too small: ${r?.rowsScored || 0}`);
            process.exit(1);
          }

          console.log('===== v0.5.1 2025 HOLDOUT RESULT =====');
          console.log(`Rows scored: ${r.rowsScored}`);
          console.log(`Exact: legacy ${(100*r.legacy.exactAgreement).toFixed(2)}% -> v0.5.1 ${(100*r.candidate.exactAgreement).toFixed(2)}%`);
          console.log(`Decision-safe: legacy ${(100*r.legacy.decisionSafeRate).toFixed(2)}% -> v0.5.1 ${(100*r.candidate.decisionSafeRate).toFixed(2)}%`);
          console.log(`Mean regret: legacy ${r.legacy.meanReferenceRegretPp.toFixed(3)} pp -> v0.5.1 ${r.candidate.meanReferenceRegretPp.toFixed(3)} pp`);
          console.log(`Strong splits: legacy ${(100*r.legacy.strongSplitRate).toFixed(2)}% -> v0.5.1 ${(100*r.candidate.strongSplitRate).toFixed(2)}%`);
          console.log(`Endgame regret: legacy ${r.endgame.legacy.meanReferenceRegretPp.toFixed(3)} pp -> v0.5.1 ${r.endgame.candidate.meanReferenceRegretPp.toFixed(3)} pp`);
          console.log(`Final-two regret: legacy ${r.endgame.finalTwoLegacy.meanReferenceRegretPp.toFixed(3)} pp -> v0.5.1 ${r.endgame.finalTwoCandidate.meanReferenceRegretPp.toFixed(3)} pp`);
          console.log(`Net reference regret saved: ${r.flips.netReferenceRegretSavedPp.toFixed(2)} pp`);
          console.log(`Flips: ${r.flips.beneficial} beneficial / ${r.flips.harmful} harmful / ${r.flips.neutral} neutral`);
          console.log(`Worst harmful flip: ${r.flips.worstHarmPp.toFixed(2)} pp`);
          NODE

      - name: Commit immutable v0.5.1 holdout result
        run: |
          STATUS="$(git status --porcelain -- public/calibration/v051-holdout*)"
          if [ -z "$STATUS" ]; then
            echo "No v0.5.1 holdout changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/calibration/v051-holdout*.json
          git commit -m "Unlock v0.5.1 2025 holdout result [skip v051]"
          git push
