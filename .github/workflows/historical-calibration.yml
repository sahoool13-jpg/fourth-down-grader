name: historical calibration (full audit)

# v0.5 change: the full 2021-2025 audit is now MANUAL ONLY so changes to the
# primary model cannot silently peek at the 2025 holdout. Development work uses
# `v0.5 endgame development audit`, which loads 2021-2024 only.
on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First NFL season"
        required: true
        default: "2021"
      end_season:
        description: "Last NFL season"
        required: true
        default: "2025"
      holdout_season:
        description: "Season reported as holdout"
        required: true
        default: "2025"

permissions:
  contents: write

concurrency:
  group: fourth-down-historical-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_SEASON: ${{ github.event.inputs.start_season }}
      END_SEASON: ${{ github.event.inputs.end_season }}
      HOLDOUT_SEASON: ${{ github.event.inputs.holdout_season }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            github::nflverse/nfl4th
            any::dplyr
            any::jsonlite
            any::stringr
      - name: Export multi-season nfl4th reference
        run: Rscript scripts/export_nfl4th_reference.R
      - name: Score current primary model
        run: node scripts/run_historical_calibration.mjs
      - name: Commit calibration output
        run: |
          STATUS="$(git status --porcelain -- public/calibration/report.json public/calibration/splits.json public/calibration/status.json)"
          if [ -z "$STATUS" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/calibration/report.json public/calibration/splits.json public/calibration/status.json
          git commit -m "Update manual full historical calibration [skip calibration]"
          git push
